[tox]
requires =
    tox>=4.32
env_list =
    py{314-316}
toxworkdir = {env:TOX_WORK_DIR:.tox}

[testenv]
passenv =
    FORCE_COLOR
skip_install = True
deps =
    # TODO: Remove when cffi releases a version supporting Python 3.16
    # https://github.com/python-cffi/cffi/pull/287
    py316: cffi @ git+https://github.com/python-cffi/cffi
    -r dev-requirements.txt
commands =
    pytest --cov=. --cov-report=xml {posargs}
